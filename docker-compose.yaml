services:
  nginx:
    image: nginx:alpine
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - flutterweb
    networks:
      - app-network

  backend:
    build:
      context: ./gobackend
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      PORT: ${PORT:-8080}
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY}
    volumes:
      - uploads_data:/root/uploads
    networks:
      - app-network

  flutterweb:
    build:
      context: ./flutter_app
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  uploads_data:

networks:
  app-network:
    driver: bridge
